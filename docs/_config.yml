# Jekyll settings for the documentation site, built by .github/workflows/pages.yml
# from a staged copy of this folder (plus QUICKSTART.md, CHEATSHEET.md, ROADMAP.md
# and CHANGELOG.md from the repository root) into /street-crime/docs/. The game
# itself is copied to the site root beside it, untouched by Jekyll.
#
# Look: DESIGN_LANGUAGE.md in the repository root, applied in assets/site.css.

title: Street Crime docs
description: How a Street Crime level is built from named Illustrator layers and a level design file, and how its characters and objects are named.
url: https://isocialpractice.github.io
baseurl: /street-crime/docs
game_url: /street-crime/
repository_url: https://github.com/isocialPractice/street-crime

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

# On by default on GitHub Pages; listed so the site does not depend on that.
#   relative-links          [x](level-design.md) becomes a link to level-design.html
#   optional-front-matter   pages need no front matter
#   readme-index            README.md is the home page
#   titles-from-headings    a page's title is its first heading
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false

# Every page uses the site's own layout. "source" is where a page lives in the
# repository, for its "Edit on GitHub" link: the pages staged from the root are
# not under docs/.
defaults:
  - scope:
      path: ""
    values:
      layout: doc
  - scope:
      path: QUICKSTART.md
    values:
      source: QUICKSTART.md
  - scope:
      path: CHEATSHEET.md
    values:
      source: CHEATSHEET.md
  - scope:
      path: ROADMAP.md
    values:
      source: ROADMAP.md
  - scope:
      path: CHANGELOG.md
    values:
      source: CHANGELOG.md

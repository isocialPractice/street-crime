<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ site.game_url }}favicon.svg">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <!-- The chosen theme, applied before the page paints so it never flashes. -->
  <script>try { var t = localStorage.getItem('sc-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>

  <header class="topbar">
    <button class="menu-toggle" id="menu-toggle" type="button" aria-controls="menu" aria-expanded="false">Menu</button>
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.game_url }}favicon.svg" alt="" width="28" height="28">
      <span class="brand-name">Street Crime</span> <span class="brand-sub">docs</span>
    </a>
    <span class="topbar-gap"></span>
    <a class="play" href="{{ site.game_url }}">Play the demo</a>
    <button class="theme-toggle" id="theme-toggle" type="button">Theme: system</button>
  </header>

  <nav class="menu" id="menu" aria-label="Documentation">
    {% include menu.html %}
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="content" id="content">
    {{ content }}

    {%- if page.source %}{% assign src = page.source %}{% else %}{% assign src = 'docs/' | append: page.path %}{% endif %}
    <footer class="page-foot">
      <a href="{{ site.repository_url }}/blob/main/{{ src }}">Edit this page on GitHub</a>
    </footer>
  </main>

  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</body>
</html>
